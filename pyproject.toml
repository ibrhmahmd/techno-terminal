[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "techno-kids"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.32.0",
    "sqlmodel>=0.0.47,<0.0.48",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "uvicorn>=0.20.0",
    "fastapi[standard]>=0.141.1,<0.142",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "supabase>=2.0.0",
    "gunicorn>=21.0.0",
    "twilio",
    "fpdf2>=2.8.0",
    "reportlab>=4.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "sqlparse>=0.5.0",
    "logfire>=5.1.0,<6",
    "opentelemetry-instrumentation-httpx>=0.49.0",
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-asgi>=0.65b0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "supabase: needs real Supabase auth/API (cloud testing project)",
]
